<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CalmKanban — Minimalist Focus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(140, 140, 140, 0.2);
      border-radius: 999px;
    }
    body.theme-slate {
      --bg: #0d1117;
      --surface: #161b22;
      --card: #1c2128;
      --card-border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #0d9488;
      --accent-hover: #14b8a6;
      --btn-bg: #21262d;
      --btn-border: #363b42;
    }
    body.theme-eink {
      --bg: #09090b;
      --surface: #18181b;
      --card: #18181b;
      --card-border: #3f3f46;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #f4f4f5;
      --accent-hover: #ffffff;
      --btn-bg: #27272a;
      --btn-border: #52525b;
      filter: grayscale(100%);
    }
    body.theme-paper {
      --bg: #f7f6f2;
      --surface: #eeece5;
      --card: #ffffff;
      --card-border: #dedad0;
      --text: #292524;
      --muted: #78716c;
      --accent: #0f766e;
      --accent-hover: #115e59;
      --btn-bg: #e7e5dc;
      --btn-border: #d6d3c8;
    }
    .bg-main { background-color: var(--bg); color: var(--text); }
    .bg-surf { background-color: var(--surface); border-color: var(--card-border); }
    .bg-card { background-color: var(--card); border-color: var(--card-border); }
    .text-muted-custom { color: var(--muted); }
    .btn-custom { background-color: var(--btn-bg); border-color: var(--btn-border); color: var(--text); }
    .btn-custom:hover { opacity: 0.9; }
    .btn-accent { background-color: var(--accent); color: #ffffff; }
    body.theme-eink .btn-accent { color: #09090b; font-weight: 600; }
  </style>
</head>
<body class="theme-slate bg-main min-h-screen flex flex-col transition-colors duration-200">

  <!-- SILENT 20-MIN VISUAL PROGRESS BAR -->
  <div id="silentBarContainer" class="w-full h-1.5 bg-black/30 overflow-hidden relative" title="Silent Visual Focus Bar">
    <div id="silentBarProgress" class="h-full bg-teal-500/80 transition-all duration-1000" style="width: 0%;"></div>
  </div>

  <!-- HEADER -->
  <header class="border-b bg-surf px-3 sm:px-6 py-2.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="flex items-center gap-2">
          <div class="w-2.5 h-2.5 rounded-full bg-teal-500"></div>
          <span class="font-semibold tracking-tight text-sm sm:text-base">CalmKanban</span>
        </div>

        <!-- 10-Point Weekly Reward Meter -->
        <button id="openVaultBtn" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-xs btn-custom" title="View Capability Vault & History">
          <span class="text-amber-400">⭐</span>
          <span id="rewardPointsLabel" class="font-semibold">0/10</span>
          <div class="hidden sm:block w-12
